name: Move LinkedIn Timeline to Separate Page

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/move-linkedin-page.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Move LinkedIn timeline
        run: python scripts/move_linkedin_to_page.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move LinkedIn updates to standalone page"
          git push
