name: Add LinkedIn Updates Section

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-linkedin-updates.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch the portfolio
        run: python scripts/add_linkedin_updates.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site changes were required."
          else
            git commit -m "Add recent public LinkedIn updates"
            git push
          fi
